# Trimmed from zaraa's friend-package-validation.yml: package bytes are
# committed in-repo (built + sanitized on the maintainer's Mac), so there is
# no build job — this runs ONLY the Windows clean-install validation, the one
# leg that cannot run locally. Node 22 LTS, no pnpm preinstalled: the
# installer under test must bootstrap pnpm itself.
name: Windows Friend Package Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Validate Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # RC6 includes better-sqlite3 11.x: Windows prebuilds cover Node22.
          node-version: 22

      - name: Validation guard regressions
        run: node --test tests/*.test.mjs

      - name: Confirm bare environment
        shell: pwsh
        run: |
          node -v
          if (Get-Command pnpm -ErrorAction SilentlyContinue) { throw 'Preinstalled pnpm would invalidate bootstrap test' }

      - name: Clean-install validation
        run: node scripts/friend-package-validate-windows-temp.mjs

      - name: Upload report
        # Upload on failure too — a failing report is the evidence we want to read.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-Windows
          path: .validation/*.json
          include-hidden-files: true
          retention-days: 7
